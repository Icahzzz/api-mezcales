{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Admin Mezcales</title>
  
  <!-- CSS Separado -->
  <link rel="stylesheet" href="{% static 'css/admin_compras.css' %}">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <section id="login" class="card">
    <h2>Acceso Administrador POS</h2>
    <p>Inicia sesión con tu cuenta admin para operar el punto de venta.</p>
    <form id="loginForm" style="grid-template-columns:1fr;">
      <div>
        <label>Usuario</label>
        <input name="username" required />
      </div>
      <div>
        <label>Contraseña</label>
        <input name="password" type="password" required />
      </div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <div id="loginStatus" class="status"></div>
  </section>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app" class="layout hidden">
    <aside>
      <div class="brand" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
        <img src="{% static 'catalogo/img/logo.png' %}" alt="Mezcal POS" style="height:180px" onerror="this.style.display='none'">
        <div style="margin-top:10px; line-height:1.3;">
          <div style="font-size:16px; letter-spacing:1px;">Administrador</div>
          <div style="font-size:22px; color:var(--accent); font-weight:700;">Mezcales</div>
        </div>
      </div>

      <div class="menu">
        <button data-view="reporte" class="active">Reporte de ventas</button>
        <button data-view="catalogos">Categorías</button>
        <button data-view="articulos">Artículos</button>
        <button data-view="promociones">Promociones</button>
        <button data-view="usuarios">Usuarios</button>
        <button data-view="compras">Compras</button>
        <button data-view="resenas">Reseñas</button>
      </div>

      <hr style="margin:14px 0; border:none; border-top:1px solid var(--line)">
      <button id="logoutBtn" class="btn danger" style="width:100%">Cerrar sesión</button>
    </aside>

    <main>
      <div class="topbar">
        <h1 id="viewTitle">Reporte de ventas</h1>
      </div>

      <!-- SECCIONES DINÁMICAS -->
      <section id="view-reporte" class="grid"></section>
      <section id="view-catalogos" class="grid hidden"></section>
      <section id="view-articulos" class="grid hidden"></section>
      <section id="view-promociones" class="grid hidden"></section>
      <section id="view-usuarios" class="grid hidden"></section>
      <section id="view-compras" class="grid hidden"></section>
      <section id="view-resenas" class="grid hidden"></section>
    </main>
  </div>

  <!-- WIDGET CHATBOT -->
  <button id="chatBtn" title="Asistente de IA">💬</button>
  <div id="chatPanel" class="hidden">
    <div class="chat-header">
      <span>Asistente POS Mezcales</span>
      <button class="chat-header-close" id="chatCloseBtn">&times;</button>
    </div>
    <div id="chatMessages">
      <div class="chat-msg chat-msg-bot">¡Hola! Soy tu asistente POS. ¿En qué puedo ayudarte hoy con el inventario o ventas?</div>
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" placeholder="Escribe tu consulta..." />
      <button class="chat-send-btn" id="chatSendBtn">➔</button>
    </div>
  </div>

  <!-- JAVASCRIPT SEPARADO -->
  <script src="{% static 'js/admin_compras.js' %}"></script>
</body>
</html>
